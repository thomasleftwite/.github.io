<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Projects & Forks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.5) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.5) 0, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 4rem 1rem 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-top: 0.5rem;
        }

        main {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }
        
        .project-title {
            font-size: 2.5rem;
            border: none;
            margin-bottom: 0;
            text-align: center;
            text-transform: capitalize;
            color: #e2e8f0;
        }

        .forks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 1rem;
            border: 2px solid var(--card-border);
        }

        .user-info h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .user-info a {
            color: var(--text-color);
            text-decoration: none;
        }

        .user-info a:hover {
            color: var(--accent-hover);
        }

        .repo-link {
            display: inline-block;
            margin-top: auto;
            padding: 0.5rem 1rem;
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent-color);
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .repo-link:hover {
            background-color: rgba(59, 130, 246, 0.4);
        }

        .loading, .error-msg {
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 2rem;
        }

        .error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
        }
        
        hr.divider {
            border: 0;
            height: 1px;
            background: var(--card-border);
            margin: 4rem 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Our Projects</h1>
        <p>Member Repositories and Forks</p>
    </header>

    <main id="projects-container">
        <!-- Projects will be dynamically injected here -->
    </main>

    <script>
        // List of all repositories to display
        const targetRepos = [
            { owner: 'neoyoshi2000', repo: 'tinygame' },
            { owner: 'u-akira', repo: 'logic-table-tennis' }
        ];

        async function fetchOriginalRepo(owner, repo, elementId) {
            const container = document.getElementById(elementId);
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const repoData = await response.json();
                
                container.innerHTML = `
                    <div class="card" style="border-color: var(--accent-color);">
                        <div class="card-header">
                            <a href="${repoData.owner.html_url}" target="_blank" rel="noopener noreferrer">
                                <img src="${repoData.owner.avatar_url}" alt="${repoData.owner.login}" class="avatar">
                            </a>
                            <div class="user-info">
                                <h3><a href="${repoData.owner.html_url}" target="_blank" rel="noopener noreferrer">${repoData.owner.login}</a></h3>
                                <span style="font-size: 0.85rem; color: #94a3b8;">Original Creator</span>
                            </div>
                        </div>
                        <a href="${repoData.html_url}" class="repo-link" target="_blank" rel="noopener noreferrer">View Original Repository</a>
                    </div>
                `;
            } catch (error) {
                console.error(`Failed to fetch original repo ${owner}/${repo}:`, error);
                container.innerHTML = `<div class="error-msg">Failed to load original repository details.</div>`;
            }
        }

        async function fetchForks(owner, repo, elementId) {
            const container = document.getElementById(elementId);
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/forks?sort=newest`;

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`GitHub API Error: ${response.status} ${response.statusText}`);
                }

                const forks = await response.json();

                if (forks.length === 0) {
                    container.innerHTML = '<div class="loading">No forks found for this repository yet.</div>';
                    return;
                }

                container.innerHTML = ''; // Clear loading message

                forks.forEach(fork => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <a href="${fork.owner.html_url}" target="_blank" rel="noopener noreferrer">
                                <img src="${fork.owner.avatar_url}" alt="${fork.owner.login}" class="avatar">
                            </a>
                            <div class="user-info">
                                <h3><a href="${fork.owner.html_url}" target="_blank" rel="noopener noreferrer">${fork.owner.login}</a></h3>
                                <span style="font-size: 0.85rem; color: #94a3b8;">Forked Member</span>
                            </div>
                        </div>
                        <a href="${fork.html_url}" class="repo-link" target="_blank" rel="noopener noreferrer">View Fork Repository</a>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(`Failed to fetch forks for ${owner}/${repo}:`, error);
                container.innerHTML = `
                    <div class="error-msg">
                        Failed to load forks.<br>
                        Make sure the repository '${owner}/${repo}' exists and is public.
                    </div>
                `;
            }
        }

        function renderProjects() {
            const container = document.getElementById('projects-container');
            container.innerHTML = ''; // Clear main container

            targetRepos.forEach((project, index) => {
                const { owner, repo } = project;
                const origId = `orig-${owner}-${repo}`;
                const forksId = `forks-${owner}-${repo}`;
                
                const projectSection = document.createElement('div');
                
                // Add a divider if it's not the first project
                const divider = index > 0 ? '<hr class="divider">' : '';

                // Replace hyphens with spaces for a nicer title display
                const displayTitle = repo.replace(/-/g, ' ');

                projectSection.innerHTML = `
                    ${divider}
                    <div style="margin-bottom: 4rem;">
                        <h2 class="project-title">${displayTitle}</h2>
                        <p style="text-align: center; color: #94a3b8; margin-bottom: 2rem;">by ${owner}</p>
                        
                        <section style="margin-bottom: 3rem;">
                            <h2>Original Project</h2>
                            <div id="${origId}" class="forks-grid">
                                <div class="loading">Loading original repository...</div>
                            </div>
                        </section>

                        <section>
                            <h2>Member Forks</h2>
                            <div id="${forksId}" class="forks-grid">
                                <div class="loading">Fetching forks...</div>
                            </div>
                        </section>
                    </div>
                `;
                
                container.appendChild(projectSection);

                // Fetch data for this project
                fetchOriginalRepo(owner, repo, origId);
                fetchForks(owner, repo, forksId);
            });
        }

        // Initialize when the DOM is ready
        document.addEventListener('DOMContentLoaded', renderProjects);
    </script>
</body>
</html>
